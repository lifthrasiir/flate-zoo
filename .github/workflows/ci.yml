name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: Swatinem/rust-cache@v2

      # Upstream sources are pinned by fetch.sh (and go.sum), so they are safe to cache. The key
      # includes the Go sources because fetch.sh also generates vendor/go-wasm2c from them.
      - name: Cache vendored sources
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor
            go/vendor
          key: vendor-${{ hashFiles('fetch.sh', 'go/go.mod', 'go/go.sum', 'go/**/*.go') }}
      - name: Fetch vendored sources
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./fetch.sh

      - run: cargo clippy --release --all-targets --features go-native -- -D warnings
      # go-native is the reference that tests/go_native.rs checks the wasm2c translation against.
      - run: cargo test --release --features go-native
      # Builds the crate from its packaged files alone, catching vendored files missing from
      # `include` in Cargo.toml (which headers are needed differs per target).
      - run: ./package.sh
      - run: ls -l target/package/*.crate

  # Every feature on its own (and none at all), built but not tested. The full powerset is
  # far too large. `native` is an internal feature implied by the C/C++ and Go backends.
  features:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Cache vendored sources
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor
            go/vendor
          key: vendor-${{ hashFiles('fetch.sh', 'go/go.mod', 'go/go.sum', 'go/**/*.go') }}
      - name: Fetch vendored sources
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./fetch.sh
      - run: cargo hack build --all-targets --each-feature --exclude-features native
